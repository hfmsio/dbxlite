# dbxlite static server.
#
# DuckDB-WASM needs a cross-origin-isolated context (crossOriginIsolated ===
# true) for OPFS persistence and file export. These three headers reproduce
# what the Vite dev server sets. Without them the app still runs queries, but
# OPFS-backed features are disabled.
#
# COEP is `credentialless` (not `require-corp`) on purpose: it keeps the
# context isolated while still allowing DuckDB's httpfs to fetch remote
# files/CSVs whose servers do not send CORP headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Applied to every response (no location below sets its own add_header, so
    # these are inherited everywhere).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # nginx's default mime.types (included at the http level by the base image)
    # maps .wasm to application/wasm on current releases; verified after build.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;

    # Content-hashed build assets: cache aggressively.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # ES modules must be served with a JS MIME type or the browser refuses to
    # load them. This nginx's default mime.types predates the .mjs mapping, so
    # set it here. (Regex locations win over prefix ones, so this also covers
    # any .mjs under /duckdb/.)
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        access_log off;
    }

    # DuckDB bundle (wasm + worker): large and effectively immutable per build.
    location /duckdb/ {
        expires 1y;
        access_log off;
    }

    # App shell and everything else: never cache the entry document so new
    # deploys are picked up immediately. try_files keeps deep-link query URLs
    # (?sql=, ?share=, ?example=) resolving to the SPA entry point.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
